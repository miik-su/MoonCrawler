name: macOS recovery model (Intel)
on:
  push:
    paths:
      - '.github/workflows/macos-recovery-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-model:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup
      - run: moon version --all
      - run: moon update
      - run: moon test storage/power_loss_model_test.mbt --target native --deny-warn
