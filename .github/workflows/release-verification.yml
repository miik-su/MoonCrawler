name: Manual cross-platform release verification
on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Explicitly run the full project suite (not dependency suites)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev curl
      - run: moon update
      - run: moon check --target native
      - run: moon test core/scope_test.mbt engine/policy_test.mbt engine/fairness_test.mbt storage/journal_test.mbt storage/file_safety_test.mbt fetcher/network_test.mbt fetcher/attack_test.mbt --target native
      - if: inputs.full_suite
        run: moon test --target native
      - run: moon run tools/cli_smoke.mbtx
      - name: Capture focused platform evidence
        if: always()
        run: moon run tools/publish_evidence.mbtx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: evidence/2026-11-13-0.2.3/
